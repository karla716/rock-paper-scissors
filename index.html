<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissors</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
            padding-top: 50px;
        }

        .game {
            background-color: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }

        #error {
            color: red;
            font-weight: bold;
        }

        #newGame {
            display: none;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>Rock Paper Scissors</h1>

        <p>First player to 3 wins!</p>

        <h2>
            Player: <span id="playerScore">0</span>
            -
            Computer: <span id="computerScore">0</span>
        </h2>

        <p id="error"></p>

        <h3>Choose one:</h3>

        <button onclick="playGame('rock')">Rock</button>

        <button onclick="playGame('paper')">Paper</button>

        <button onclick="playGame('scissors')">Scissors</button>

        <div id="result">
            <p>Make your choice to start!</p>
        </div>

        <button id="newGame" onclick="startNewGame()">
            New Game
        </button>

    </div>


    <script>

        // Keep track of the scores
        let playerScore = 0;
        let computerScore = 0;


        function playGame(playerChoice) {

            // List of choices that are allowed
            let choices = ["rock", "paper", "scissors"];


            // Validation
            if (!choices.includes(playerChoice)) {
                document.getElementById("error").innerHTML =
                    "Invalid choice. Please choose Rock, Paper, or Scissors.";

                return;
            }


            // Clear the error message
            document.getElementById("error").innerHTML = "";


            // Computer chooses randomly
            let randomNumber = Math.floor(Math.random() * 3);
            let computerChoice = choices[randomNumber];


            // Find out who won
            if (playerChoice == computerChoice) {

                document.getElementById("result").innerHTML =
                    "<p>It's a tie! Both chose " + playerChoice + ".</p>";

            }

            else if (
                (playerChoice == "rock" && computerChoice == "scissors") ||
                (playerChoice == "paper" && computerChoice == "rock") ||
                (playerChoice == "scissors" && computerChoice == "paper")
            ) {

                playerScore++;

                document.getElementById("result").innerHTML =
                    "<p>You win this round!</p>" +
                    "<p>You chose " + playerChoice +
                    " and the computer chose " + computerChoice + ".</p>";

            }

            else {

                computerScore++;

                document.getElementById("result").innerHTML =
                    "<p>Computer wins this round!</p>" +
                    "<p>You chose " + playerChoice +
                    " and the computer chose " + computerChoice + ".</p>";
            }


            // Update the scores on the page
            document.getElementById("playerScore").innerHTML = playerScore;
            document.getElementById("computerScore").innerHTML = computerScore;


            // Check if someone has won the game
            if (playerScore == 3) {

                document.getElementById("result").innerHTML =
                    "<h2>You won the game!</h2>";

                endGame();
            }

            else if (computerScore == 3) {

                document.getElementById("result").innerHTML =
                    "<h2>The computer won the game!</h2>";

                endGame();
            }
        }


        // Stop the game when someone reaches 3
        function endGame() {

            document.querySelectorAll("button").forEach(function(button) {

                if (button.id != "newGame") {
                    button.disabled = true;
                }

            });

            document.getElementById("newGame").style.display = "inline-block";
        }


        // Start a new game
        function startNewGame() {

            playerScore = 0;
            computerScore = 0;

            document.getElementById("playerScore").innerHTML = "0";
            document.getElementById("computerScore").innerHTML = "0";

            document.getElementById("result").innerHTML =
                "<p>Make your choice to start!</p>";

            document.getElementById("error").innerHTML = "";

            // Enable the three game buttons again
            document.querySelectorAll("button").forEach(function(button) {
                button.disabled = false;
            });

            document.getElementById("newGame").style.display = "none";
        }

    </script>

</body>
</html>
